name: Validate with hassfest

# Scheduled testing discontinued following the HACS Refresh sunset.
# Manual execution remains available for troubleshooting or verification.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: "ubuntu-latest"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
