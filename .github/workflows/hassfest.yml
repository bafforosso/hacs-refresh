name: Validate with hassfest

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: "ubuntu-latest"

    steps:
      - name: Check out repository
        uses: "actions/checkout@v7"

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
