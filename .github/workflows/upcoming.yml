name: Test Home Assistant beta

on:
  schedule:
    - cron: "15 11 * * 5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pytest - Python 3.14 / HA beta
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Check Home Assistant version
        id: home-assistant
        run: |
          ha_version="$(
            uv run --isolated --no-project \
              --python 3.14 \
              --with pytest \
              --with pytest-homeassistant-custom-component \
              python -c 'from importlib.metadata import version; print(version("homeassistant"))'
          )"

          phacc_version="$(
            uv run --isolated --no-project \
              --python 3.14 \
              --with pytest \
              --with pytest-homeassistant-custom-component \
              python -c 'from importlib.metadata import version; print(version("pytest-homeassistant-custom-component"))'
          )"

          echo "Home Assistant version: $ha_version"
          echo "pytest-homeassistant-custom-component version: $phacc_version"

          echo "version=$ha_version" >> "$GITHUB_OUTPUT"

      - name: Run tests against Home Assistant beta
        if: contains(steps.home-assistant.outputs.version, 'b')
        run: |
          uv run --isolated --no-project \
            --python 3.14 \
            --with pytest \
            --with pytest-homeassistant-custom-component \
            pytest

      - name: No Home Assistant beta available
        if: "!contains(steps.home-assistant.outputs.version, 'b')"
        run: |
          echo "Home Assistant ${{ steps.home-assistant.outputs.version }} is not a beta."
          echo "No upcoming release test is required this week."
