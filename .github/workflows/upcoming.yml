name: Test Home Assistant beta

on:
  schedule:
    - cron: "15 11 * * 5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pytest - Python 3.14 / HA beta
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Check latest Home Assistant release
        id: home-assistant
        shell: bash
        run: |
          set -euo pipefail

          ha_version="$(
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/home-assistant/core/releases?per_page=1" |
              jq --exit-status --raw-output '.[0].tag_name'
          )"

          echo "Latest Home Assistant release: $ha_version"

          if [[ "$ha_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$ha_version" >> "$GITHUB_OUTPUT"

      - name: Run tests against Home Assistant beta
        if: steps.home-assistant.outputs.is_beta == 'true'
        env:
          HA_VERSION: ${{ steps.home-assistant.outputs.version }}
        run: |
          uv run --isolated --no-project \
            --python 3.14 \
            --with "homeassistant==$HA_VERSION" \
            --with "pytest-homeassistant==$HA_VERSION" \
            --with "pytest-timeout>=2.4.0" \
            pytest

      - name: No Home Assistant beta available
        if: steps.home-assistant.outputs.is_beta != 'true'
        env:
          HA_VERSION: ${{ steps.home-assistant.outputs.version }}
        run: |
          echo "Latest Home Assistant release is $HA_VERSION."
          echo "It is not a beta. Skipping tests."
