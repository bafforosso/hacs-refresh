
name: Test Home Assistant beta

# Scheduled testing discontinued following the HACS Refresh sunset.
# Manual execution remains available for troubleshooting or verification.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pytest - Python 3.14 / HA beta
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Check latest Home Assistant release
        id: home-assistant
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(
            curl --fail --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/home-assistant/core/releases?per_page=1"
          )"

          ha_version="$(jq --exit-status --raw-output '.[0].tag_name // empty' <<< "$release_json")"
          is_prerelease="$(jq --exit-status --raw-output '.[0].prerelease' <<< "$release_json")"

          if [[ -z "$ha_version" ]]; then
            echo "::error::Could not determine the latest Home Assistant release."
            exit 1
          fi

          echo "Latest Home Assistant release: $ha_version"
          echo "Prerelease: $is_prerelease"

          if [[ "$is_prerelease" == "false" ]]; then
            if [[ "$ha_version" =~ b[0-9]+$ ]]; then
              echo "::error::Home Assistant release is marked stable but has a beta version tag: $ha_version"
              exit 1
            fi

            echo "Latest Home Assistant release is stable. Skipping beta tests."
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$ha_version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+b[0-9]+$ ]]; then
            echo "::error::Unexpected Home Assistant prerelease version: $ha_version"
            exit 1
          fi

          echo "Checking matching pytest-homeassistant release on PyPI..."

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            "https://pypi.org/pypi/pytest-homeassistant/${ha_version}/json" |
            jq --exit-status --arg version "$ha_version" '
              .info.version == $version
              and any(.urls[]?; .yanked == false)
            ' > /dev/null

          echo "Matching pytest-homeassistant release is available."

          echo "version=$ha_version" >> "$GITHUB_OUTPUT"
          echo "is_beta=true" >> "$GITHUB_OUTPUT"

      - name: Run tests against Home Assistant beta
        if: steps.home-assistant.outputs.is_beta == 'true'
        env:
          HA_VERSION: ${{ steps.home-assistant.outputs.version }}
        run: |
          uv run --isolated --no-project \
            --python 3.14 \
            --with "homeassistant==$HA_VERSION" \
            --with "pytest-homeassistant==$HA_VERSION" \
            --with "pytest-timeout>=2.4.0" \
            pytest

      - name: No Home Assistant beta available
        if: steps.home-assistant.outputs.is_beta != 'true'
        run: |
          echo "Latest Home Assistant release is stable."
          echo "Skipping beta tests."
