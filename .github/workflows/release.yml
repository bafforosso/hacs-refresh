name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  package:
    name: Package release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release version
        run: python3 scripts/check_version.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Create release ZIP
        run: |
          cd custom_components/hacs_refresh
          zip "$GITHUB_WORKSPACE/hacs_refresh.zip" -r ./

      - name: Upload release ZIP
        run: gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/hacs_refresh.zip"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
