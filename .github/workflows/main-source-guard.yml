name: Main Branch Source Guard

on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-source-branch:
    name: Validate PR source branch
    runs-on: ubuntu-latest

    steps:
      - name: Require dev as source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REF" != "dev" || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Pull requests targeting main must come from the dev branch in this repository."
            exit 1
          fi

          echo "Pull request source is this repository's dev branch."
