name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run pre-commit
        run: uv run --locked pre-commit run --all-files

  current-stack:
    name: Pytest - Python 3.14 / current HA (Locked)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run tests
        run: uv run --locked pytest --cov=. --cov-report=term-missing

      - name: Check integration module coverage
        run: |
          for module in custom_components/hacs_refresh/*.py; do
            uv run --locked coverage report "$module"
          done

      - name: Check config flow coverage
        run: |
          uv run --locked coverage report --fail-under=100 custom_components/hacs_refresh/config_flow.py

  minimum-compatibility:
    name: Pytest - Python 3.12 / HA 2024.12.0
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run tests
        run: uv run --isolated --no-project --python 3.12 --with pytest --with pytest-homeassistant-custom-component==0.13.190 pytest
