name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run pre-commit
        run: uv run --locked pre-commit run --all-files

  current-stack:
    name: Pytest - Python 3.14 / current HA (Locked)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run tests
        run: uv run --locked pytest --cov=. --cov-report=term-missing

      - name: Check integration module coverage
        shell: bash
        run: |
          mapfile -d '' modules < <(
            find custom_components/hacs_refresh -type f -name '*.py' -print0
          )

          if (( ${#modules[@]} == 0 )); then
            echo "::error::No Python modules found under custom_components/hacs_refresh"
            exit 1
          fi

          for module in "${modules[@]}"; do
            echo "::group::Coverage: ${module}"
            uv run --locked coverage report --fail-under=95.01 "$module"
            echo "::endgroup::"
          done

      - name: Check config flow coverage
        run: |
          uv run --locked coverage report --fail-under=100 custom_components/hacs_refresh/config_flow.py

  minimum-compatibility:
    name: Pytest - Python 3.12 / HA 2024.12.0
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run tests
        run: uv run --isolated --no-project --python 3.12 --with pytest --with pytest-homeassistant-custom-component==0.13.190 pytest
