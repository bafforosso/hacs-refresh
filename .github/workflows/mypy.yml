name: Mypy

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  current-stack:
    name: MyPy - Python 3.14 / current HA (Locked)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Check types
        run: uv run --locked mypy custom_components/hacs_refresh tests

  minimum-compatibility:
    name: MyPy - Python 3.12 / HA 2024.12.0
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check types
        run: >
          uv run
          --no-project
          --python 3.12
          --with mypy
          --with pytest-homeassistant-custom-component==0.13.190
          mypy
          --python-version 3.12
          --disable-error-code unused-ignore
          custom_components/hacs_refresh
          tests
