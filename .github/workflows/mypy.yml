name: Mypy

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  current-stack:
    name: MyPy - Python 3.14 / current HA (Locked)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Check types
        run: uv run --locked mypy custom_components/hacs_refresh tests

  minimum-compatibility:
    name: MyPy - Python 3.12 / HA 2024.12.0
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check types
        run: >
          uv run
          --no-project
          --python 3.12
          --with mypy
          --with pytest-homeassistant-custom-component==0.13.190
          mypy
          --python-version 3.12
          --disable-error-code unused-ignore
          custom_components/hacs_refresh
          tests
