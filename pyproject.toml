[project]
name = "hacs-refresh"
version = "0.5.1"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-homeassistant-custom-component",
    "ruff>=0.16.6",
]
