[project]
name = "hacs-refresh"
version = "1.3.1"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-homeassistant==2026.11.0b6",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
precision = 2
fail_under = 95.01

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
timeout = 60

[tool.ruff.lint]
extend-select = ["DTZ001", "DTZ007"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.uv]
package = false
environments = [
    "python_full_version >= '3.14.2' and python_full_version < '3.15'",
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.14.2" }
