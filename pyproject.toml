[project]
name = "hacs-refresh"
version = "0.5.1"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "ruff>=0.16.6",
]
